<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="a.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-content">
        <h2>MyGram</h2>
        <div class="nav-icons">🏠 ✉️ 👤</div>
    </div>
</nav>

<!-- PROFILE -->
<header class="profile-header">
    <div class="profile-info">
        <img src="https://via.placeholder.com/150" class="profile-pic">
        <div>
            <h1>Ben Hambelton</h1>
            <div class="username">@BenHambelton56</div>

            <div class="stats">
                <span><strong>2</strong> Posts</span>
                <span><strong>1.1M</strong> Followers</span>
                <span><strong>50</strong> Following</span>
            </div>

            <p class="bio">Norfolk | Dexter</p>
        </div>
    </div>

    <!-- STORIES -->
    <div class="stories">
        <div class="story"><div class="story-circle"></div><span>Story 1</span></div>
        <div class="story"><div class="story-circle"></div><span>Story 2</span></div>
        <div class="story"><div class="story-circle"></div><span>Story 3</span></div>
    </div>
</header>

<!-- POSTS -->
<main>
    <div class="grid">
        <a href="about.html" class="post">
            <img src="https://picsum.photos/300?1">
            <div class="overlay">❤ 10 💬 3</div>
        </a>
        <a href="contact.html" class="post">
            <img src="https://picsum.photos/300?2">
            <div class="overlay">❤ 5 💬 1</div>
        </a>
    </div>
</main>

</body>
</html>
